name: Daily Volleyball Stats

on:
  schedule:
    # 11:00 UTC = 7:00am ET (6:00am during EDT... adjust as you like)
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually any time

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats and build dashboard
        run: python fetch_stats.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "courtside-kiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/raw/*.json || true
          git diff --quiet --cached || git commit -m "Daily stats refresh $(date -u +%Y-%m-%d)"
          git push
