name: Daily Volleyball Stats

on:
  schedule:
    # 11:00 UTC = 7:00am ET (6:00am during EDT... adjust as you like)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Start date (YYYY-MM-DD). Leave blank for yesterday + today."
        required: false
      end_date:
        description: "Optional end date (YYYY-MM-DD) to pull a whole range."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats and build dashboard
        run: |
          python fetch_stats.py "${{ github.event.inputs.date }}" "${{ github.event.inputs.end_date }}"

      - name: Commit and push updated dashboard
        run: |
          git config user.name "courtside-kiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data/raw || true
          git diff --quiet --cached || git commit -m "Daily stats refresh $(date -u +%Y-%m-%d)"
          git push
